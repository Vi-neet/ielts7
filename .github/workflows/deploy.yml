name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - stage
  pull_request:
    branches:
      - stage

jobs:
  # 1. PR Check: Verifies compilation & type safety when a PR is raised against 'stage'
  pr-check:
    if: github.event_name == 'pull_request'
    name: PR Build & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Type Check
        run: npx tsc --noEmit

  # 2. Production Deployment: Deploys to Cloudflare Workers ONLY when code lands on 'stage' (via PR merge or commit)
  deploy-cloudflare:
    if: github.event_name == 'push' && github.ref == 'refs/heads/stage'
    name: Build & Deploy Cloudflare Worker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build OpenNext Worker Bundle
        run: npm run build:worker

      - name: Deploy to Cloudflare Workers
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

