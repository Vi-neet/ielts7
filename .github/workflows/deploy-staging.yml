name: Deploy to Cloudflare Workers & Firebase Infrastructure

on:
  push:
    branches:
      - stage
      - main

jobs:
  deploy-cloudflare:
    name: Build & Deploy Cloudflare Worker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build OpenNext Worker Bundle
        run: npm run build:worker

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

  deploy-firebase-infra:
    name: Deploy Firebase Security Rules & Indexes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Firebase CLI
        if: ${{ secrets.FIREBASE_TOKEN != '' }}
        run: npm install -g firebase-tools

      - name: Deploy Firebase Rules and Indexes
        if: ${{ secrets.FIREBASE_TOKEN != '' }}
        run: firebase deploy --only firestore:rules,firestore:indexes,storage --project ielts7-48b25 --token "${{ secrets.FIREBASE_TOKEN }}"
