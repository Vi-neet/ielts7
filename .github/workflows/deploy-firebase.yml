name: Deploy Firebase Security Rules & Indexes

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - stage
    paths:
      - 'firestore.rules'
      - 'storage.rules'
      - 'firestore.indexes.json'

jobs:
  deploy-firebase-infra:
    name: Deploy Firebase Rules & Indexes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy Rules and Indexes
        # Uses FIREBASE_TOKEN if set in repository secrets.
        # continue-on-error ensures missing/expired CI tokens log a warning without failing workflow runs.
        if: ${{ secrets.FIREBASE_TOKEN != '' }}
        continue-on-error: true
        run: firebase deploy --only firestore:rules,firestore:indexes,storage --project ielts7-48b25 --token "${{ secrets.FIREBASE_TOKEN }}"
